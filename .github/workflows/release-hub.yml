name: Publish Hub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Hub semantic version without the v prefix (for example 1.0.1)
        required: true
        type: string
      confirm:
        description: Type PUBLISH to permit tag and Release publication
        required: true
        type: string
      approved_note_additions:
        description: Optional maintainer-approved English additions to the Release notes
        required: false
        default: ''
        type: string
      recover_existing_tag:
        description: Create only a missing Release for an exact existing annotated tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hub-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      destination_action: ${{ steps.candidate.outputs.destination_action }}
    steps:
      - name: Checkout the protected main candidate
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install release validation dependencies
        run: python3 -m pip install -r .github/requirements.txt

      - name: Validate confirmation, main, and destination availability
        id: candidate
        env:
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
          RECOVER_EXISTING_TAG: ${{ inputs.recover_existing_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == PUBLISH ]] || { echo "confirm must equal PUBLISH" >&2; exit 1; }
          [[ "$RECOVER_EXISTING_TAG" == true || "$RECOVER_EXISTING_TAG" == false ]] || exit 1
          python3 -B .github/scripts/release_contract.py validate-version "$VERSION"
          tag="v$VERSION"
          git fetch --tags origin main
          git diff --quiet HEAD origin/main
          git diff --quiet origin/main HEAD
          test -z "$(git status --porcelain)" || { echo "main checkout is not clean" >&2; exit 1; }
          main_sha=$(git rev-parse HEAD)
          [[ "$main_sha" == "$(git rev-parse origin/main)" ]] || {
            echo "main changed while preflight was running; rerun the release" >&2; exit 1;
          }
          tag_refs_file=$(mktemp)
          release_response_file=$(mktemp)
          cleanup() { rm -f "$tag_refs_file" "$release_response_file"; }
          trap cleanup EXIT
          git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" > "$tag_refs_file"
          candidate_sha="$main_sha"
          if [[ "$RECOVER_EXISTING_TAG" == true ]]; then
            recovered_sha=$(awk -v ref="refs/tags/$tag^{}" '$2 == ref { print $1 }' "$tag_refs_file")
            [[ -z "$recovered_sha" ]] || candidate_sha="$recovered_sha"
          fi
          set +e
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$release_response_file" 2>&1
          set -e
          release_status=$(python3 -B .github/scripts/release_contract.py http-status \
            --response-file "$release_response_file")
          destination_action=$(python3 -B .github/scripts/release_contract.py destination-state \
            --tag-refs-file "$tag_refs_file" --tag "$tag" --candidate-sha "$candidate_sha" \
            --release-status "$release_status" --recover-existing-tag "$RECOVER_EXISTING_TAG")
          if [[ "$destination_action" == release-only ]]; then
            git merge-base --is-ancestor "$candidate_sha" origin/main || {
              echo "recovery tag target is not protected main history" >&2; exit 1;
            }
            git switch --detach "$candidate_sha"
            test -z "$(git status --porcelain)" || exit 1
          fi
          printf 'candidate_sha=%s\ndestination_action=%s\n' \
            "$candidate_sha" "$destination_action" >> "$GITHUB_OUTPUT"

      - name: Collect pinned component release records
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/release-components.json"
          import json
          from pathlib import Path
          import yaml

          rows = []
          for path in sorted(Path("components.d").glob("*.yml")):
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              rows.append({"name": data["name"], "repo": data["repo"], "ref": data["ref"]})
          print(json.dumps(rows))
          PY

      - name: Collect merged component-upgrade metadata since the previous Hub tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git tag --merged HEAD --list 'v*' > "$RUNNER_TEMP/merged-hub-tags.txt"
          previous_tag=$(python3 -B .github/scripts/release_contract.py previous-tag \
            --tags-file "$RUNNER_TEMP/merged-hub-tags.txt" --destination-tag "v$VERSION")
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100" |
            jq '[.[][] | select(.merged_at != null and ([.labels[].name] | index("component-upgrade"))) |
              {number: .number, mergedAt: .merged_at, mergeCommit: {oid: .merge_commit_sha}, body: .body}]' \
              > "$RUNNER_TEMP/merged-prs.json"
          python3 - "$previous_tag" "$RUNNER_TEMP/merged-prs.json" "$RUNNER_TEMP/release-upgrades.json" <<'PY'
          import json
          import importlib.util
          from pathlib import Path
          import subprocess
          import sys

          previous_tag, source, destination = sys.argv[1:]
          rows = json.loads(Path(source).read_text(encoding="utf-8"))
          module_path = Path(".github/scripts/render_hub_release_notes.py")
          spec = importlib.util.spec_from_file_location("release_notes", module_path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          upgrades = []
          for row in rows:
              sha = ((row.get("mergeCommit") or {}).get("oid"))
              if not sha:
                  continue
              if subprocess.run(["git", "merge-base", "--is-ancestor", sha, "HEAD"]).returncode != 0:
                  continue
              if previous_tag and subprocess.run(["git", "merge-base", "--is-ancestor", sha, previous_tag]).returncode == 0:
                  continue
              try:
                  upgrades.append(module.parse_merged_upgrade_metadata({
                      "number": row["number"], "merged_at": row.get("mergedAt") or "",
                      "body": row.get("body") or "",
                  }))
              except ValueError as error:
                  raise SystemExit(str(error)) from error
          Path(destination).write_text(json.dumps(upgrades), encoding="utf-8")
          PY

      - name: Fetch GitHub facts for every source Release used in the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requests_file="$RUNNER_TEMP/release-requests.json"
          facts_file=$(mktemp)
          cleanup() { rm -f "$facts_file"; }
          trap cleanup EXIT
          python3 - "$RUNNER_TEMP/release-components.json" "$RUNNER_TEMP/release-upgrades.json" <<'PY' > "$requests_file"
          import importlib.util
          import json
          import sys
          from pathlib import Path

          module_path = Path(".github/scripts/render_hub_release_notes.py")
          spec = importlib.util.spec_from_file_location("release_notes", module_path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          components = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          upgrades = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          records = module._validate_component_rows(components)
          for upgrade in module._validate_upgrade_rows(upgrades):
              records.append({"repo": module.COMPONENT_REPOSITORIES[upgrade["component"]], "ref": upgrade["to_tag"]})
          unique = {(record["repo"], record["ref"]): record for record in records}
          print(json.dumps(list(unique.values())))
          PY
          while IFS= read -r request; do
            repo=$(jq -r '.repo' <<<"$request")
            ref=$(jq -r '.ref' <<<"$request")
            release=$(gh api "repos/$repo/releases/tags/$ref")
            tag_ref=$(gh api "repos/$repo/git/ref/tags/$ref")
            tag_object_sha=$(jq -r '.object.sha // empty' <<<"$tag_ref")
            [[ -n "$tag_object_sha" ]] || { echo "source tag object SHA is missing: $repo $ref" >&2; exit 1; }
            tag_object=$(gh api "repos/$repo/git/tags/$tag_object_sha")
            jq -n --arg repo "$repo" --arg tag "$ref" --argjson release "$release" \
              --argjson tag_ref "$tag_ref" --argjson tag_object "$tag_object" \
              '{repo: $repo, tag: $tag, release: $release, tag_ref: $tag_ref, tag_object: $tag_object}' \
              >> "$facts_file"
          done < <(jq -c '.[]' "$requests_file")
          jq -s . "$facts_file" > "$RUNNER_TEMP/release-facts.json"
          python3 -B .github/scripts/release_contract.py validate-facts \
            --facts-json "$RUNNER_TEMP/release-facts.json" > /dev/null

      - name: Run Hub tests and isolated clean-clone smoke checks
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -v
          smoke_root=$(mktemp -d)
          cleanup() { rm -rf "$smoke_root"; }
          trap cleanup EXIT
          git clone --no-local "$GITHUB_WORKSPACE" "$smoke_root/hub"
          test -f "$smoke_root/hub/skills/rdk-skill-finder/SKILL.md"
          mkdir "$smoke_root/x5-project" "$smoke_root/s-project"
          bash "$smoke_root/hub/skills/oe-skills-x5/setup.sh" --ref "smoke" "$smoke_root/x5-project"
          bash "$smoke_root/hub/skills/oe-skills-s/setup.sh" --ref "smoke" "$smoke_root/s-project"
          test "$(cat "$smoke_root/x5-project/.drobotics/INSTALLED_REF")" = smoke
          test "$(cat "$smoke_root/s-project/.horizon/INSTALLED_REF")" = smoke

      - name: Render validated English Release notes
        env:
          VERSION: ${{ inputs.version }}
          ADDITIONS: ${{ inputs.approved_note_additions }}
        run: |
          set -euo pipefail
          additions_file=$(mktemp)
          trap 'rm -f "$additions_file"' EXIT
          printf '%s' "$ADDITIONS" > "$additions_file"
          python3 -B .github/scripts/render_hub_release_notes.py \
            --version "$VERSION" \
            --components-json "$RUNNER_TEMP/release-components.json" \
            --upgrades-json "$RUNNER_TEMP/release-upgrades.json" \
            --release-facts-json "$RUNNER_TEMP/release-facts.json" \
            --additions-file "$additions_file" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Bind recovery to the notes preserved by the existing tag
        if: steps.candidate.outputs.destination_action == 'release-only'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag_object_file=$(mktemp)
          trap 'rm -f "$tag_object_file"' EXIT
          git cat-file tag "v$VERSION" > "$tag_object_file"
          python3 -B .github/scripts/release_contract.py verify-notes-hash \
            --tag-object-file "$tag_object_file" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Store validated Release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            ${{ runner.temp }}/release-notes.md
            ${{ runner.temp }}/release-components.json
            ${{ runner.temp }}/release-upgrades.json
            ${{ runner.temp }}/release-requests.json
            ${{ runner.temp }}/release-facts.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout the verified main candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated Release evidence
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: ${{ runner.temp }}/release-evidence

      - name: Revalidate sources and publish the immutable destination
        env:
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
          RECOVER_EXISTING_TAG: ${{ inputs.recover_existing_tag }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          PREFLIGHT_ACTION: ${{ needs.preflight.outputs.destination_action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == PUBLISH ]] || exit 1
          [[ "$RECOVER_EXISTING_TAG" == true || "$RECOVER_EXISTING_TAG" == false ]] || exit 1
          [[ "$PREFLIGHT_ACTION" == create-tag || "$PREFLIGHT_ACTION" == release-only ]] || exit 1
          python3 -B .github/scripts/release_contract.py validate-version "$VERSION"
          tag="v$VERSION"
          git fetch --tags origin main
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]] || { echo "candidate checkout changed" >&2; exit 1; }
          if [[ "$PREFLIGHT_ACTION" == create-tag ]]; then
            [[ "$(git rev-parse origin/main)" == "$CANDIDATE_SHA" ]] || {
              echo "main advanced during Environment approval; rerun the release" >&2; exit 1;
            }
          else
            git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main || {
              echo "recovery candidate left protected main history" >&2; exit 1;
            }
          fi
          test -z "$(git status --porcelain)" || exit 1

          evidence_root="$RUNNER_TEMP/release-evidence"
          requests_file="$evidence_root/release-requests.json"
          expected_facts="$evidence_root/release-facts.json"
          notes_file="$evidence_root/release-notes.md"
          test -s "$requests_file" && test -s "$expected_facts" && test -s "$notes_file" || {
            echo "validated Release evidence is missing" >&2; exit 1;
          }
          current_facts=$(mktemp)
          fact_rows=$(mktemp)
          tag_refs_file=$(mktemp)
          release_response_file=$(mktemp)
          tag_object_file=$(mktemp)
          cleanup() { rm -f "$current_facts" "$fact_rows" "$tag_refs_file" "$release_response_file" "$tag_object_file"; }
          trap cleanup EXIT
          while IFS= read -r request; do
            repo=$(jq -r '.repo' <<<"$request")
            ref=$(jq -r '.ref' <<<"$request")
            [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
            python3 -B .github/scripts/release_contract.py validate-tag "$ref"
            release=$(gh api "repos/$repo/releases/tags/$ref")
            tag_ref=$(gh api "repos/$repo/git/ref/tags/$ref")
            tag_object_sha=$(jq -r '.object.sha // empty' <<<"$tag_ref")
            [[ "$tag_object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
            tag_object=$(gh api "repos/$repo/git/tags/$tag_object_sha")
            jq -n --arg repo "$repo" --arg tag "$ref" --argjson release "$release" \
              --argjson tag_ref "$tag_ref" --argjson tag_object "$tag_object" \
              '{repo: $repo, tag: $tag, release: $release, tag_ref: $tag_ref, tag_object: $tag_object}' \
              >> "$fact_rows"
          done < <(jq -c '.[]' "$requests_file")
          jq -s . "$fact_rows" > "$current_facts"
          python3 -B .github/scripts/release_contract.py compare-facts \
            --expected-json "$expected_facts" --current-json "$current_facts" > /dev/null

          git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" > "$tag_refs_file"
          set +e
          gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$release_response_file" 2>&1
          set -e
          release_status=$(python3 -B .github/scripts/release_contract.py http-status \
            --response-file "$release_response_file")
          destination_action=$(python3 -B .github/scripts/release_contract.py destination-state \
            --tag-refs-file "$tag_refs_file" --tag "$tag" --candidate-sha "$CANDIDATE_SHA" \
            --release-status "$release_status" --recover-existing-tag "$RECOVER_EXISTING_TAG")
          [[ "$destination_action" == "$PREFLIGHT_ACTION" ]] || {
            echo "release destination changed during Environment approval" >&2; exit 1;
          }

          if [[ "$destination_action" == create-tag ]]; then
            notes_sha=$(python3 -B .github/scripts/release_contract.py notes-sha --notes-file "$notes_file")
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git tag -a "$tag" "$CANDIDATE_SHA" -m "RDK Skills $tag" \
              -m "Release-Notes-SHA256: $notes_sha"
            git push origin "$tag"
          elif [[ "$destination_action" == release-only ]]; then
            git cat-file tag "$tag" > "$tag_object_file"
            python3 -B .github/scripts/release_contract.py verify-notes-hash \
              --tag-object-file "$tag_object_file" --notes-file "$notes_file"
          else
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "RDK Skills v$VERSION" --notes-file "$notes_file"
