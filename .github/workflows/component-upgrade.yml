name: Create component upgrade PR

on:
  workflow_dispatch:
    inputs:
      schema_version:
        description: Dispatcher payload schema (automated runs use 1)
        required: false
        default: '1'
        type: string
      source_repo:
        description: Source repository, for example D-Robotics/bsp-skills
        required: true
        type: string
      tag:
        description: Published stable source Release tag
        required: true
        type: string
      release_url:
        description: Canonical Release URL supplied by the dispatcher
        required: false
        default: ''
        type: string
      target_sha:
        description: Dereferenced source commit supplied by the dispatcher
        required: false
        default: ''
        type: string
      published_at:
        description: GitHub Release publication time supplied by the dispatcher
        required: false
        default: ''
        type: string
      dry_run:
        description: Validate without creating a branch or pull request
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: component-upgrade-${{ inputs.source_repo }}
  cancel-in-progress: false

jobs:
  review-handoff:
    if: >-
      ${{
        inputs.schema_version == 'review-handoff-pr-8-app-push' &&
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'D-Robotics/rdk-skills' &&
        github.ref == 'refs/heads/fix/release-app-tag-protection' &&
        github.actor == 'maxma615' &&
        github.triggering_actor == 'maxma615' &&
        github.run_attempt == 1
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify the fixed App-push handoff
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR: '7'
          REPLACEMENT_PR: '8'
          SOURCE_SHA: 06178a102b0f18ed10a1655ffe9157d028f88565
          EXPECTED_TARGET_HEAD: 37333cd2511379305df5b210feee0eb00b0e1194
          TARGET_BRANCH: bot/component-upgrade/release-hardening-review
          DISPATCH_SCHEMA: ${{ inputs.schema_version }}
          DISPATCH_SOURCE_REPO: ${{ inputs.source_repo }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == maxma615 ]]
          [[ "$GITHUB_TRIGGERING_ACTOR" == maxma615 ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REPOSITORY" == D-Robotics/rdk-skills ]]
          [[ "$GITHUB_REF" == refs/heads/fix/release-app-tag-protection ]]
          [[ "$DISPATCH_SCHEMA" == review-handoff-pr-8-app-push ]]
          [[ "$DISPATCH_SOURCE_REPO" == D-Robotics/bsp-skills ]]
          [[ "$DISPATCH_TAG" == v1.0.0 ]]
          [[ "$DISPATCH_DRY_RUN" == true ]]
          source_pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR")
          [[ "$(jq -r '.state' <<<"$source_pr")" == open ]]
          [[ "$(jq -r '.base.ref' <<<"$source_pr")" == main ]]
          [[ "$(jq -r '.user.login' <<<"$source_pr")" == maxma615 ]]
          current_head=$(jq -r '.head.sha' <<<"$source_pr")
          [[ "$current_head" == "$GITHUB_SHA" ]]
          comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$current_head")
          [[ "$(jq -r '.status' <<<"$comparison")" == ahead ]]
          [[ "$(jq -r '.behind_by' <<<"$comparison")" == 0 ]]
          [[ "$(jq -r '.files | length' <<<"$comparison")" == 1 ]]
          [[ "$(jq -r '.files[0].filename' <<<"$comparison")" == .github/workflows/component-upgrade.yml ]] || {
            echo "the source PR differs from the reviewed candidate outside the one-time helper" >&2
            exit 1
          }
          replacement_pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$REPLACEMENT_PR")
          [[ "$(jq -r '.state' <<<"$replacement_pr")" == open ]]
          [[ "$(jq -r '.user.login' <<<"$replacement_pr")" == 'd-robotics-rdk-component-pr-bot[bot]' ]]
          [[ "$(jq -r '.base.ref' <<<"$replacement_pr")" == main ]]
          [[ "$(jq -r '.head.ref' <<<"$replacement_pr")" == "$TARGET_BRANCH" ]]
          [[ "$(jq -r '.head.sha' <<<"$replacement_pr")" == "$EXPECTED_TARGET_HEAD" ]]
          source_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" --jq '.tree.sha')
          target_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$EXPECTED_TARGET_HEAD" --jq '.tree.sha')
          [[ "$target_tree" == "$source_tree" ]] || {
            echo "the replacement PR tree differs from the reviewed candidate" >&2
            exit 1
          }

      - name: Create exact-repository App-push token
        id: handoff-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RDK_COMPONENT_PR_BOT_APP_ID }}
          private-key: ${{ secrets.RDK_COMPONENT_PR_BOT_PRIVATE_KEY }}
          owner: D-Robotics
          repositories: rdk-skills
          permission-contents: write

      - name: Checkout the fixed handoff branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bot/component-upgrade/release-hardening-review
          fetch-depth: 0
          token: ${{ steps.handoff-app-token.outputs.token }}

      - name: Attribute the final identical-tree push to the Component App
        env:
          SOURCE_SHA: 06178a102b0f18ed10a1655ffe9157d028f88565
          EXPECTED_TARGET_HEAD: 37333cd2511379305df5b210feee0eb00b0e1194
          TARGET_BRANCH: bot/component-upgrade/release-hardening-review
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TARGET_HEAD" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$(git rev-parse "$SOURCE_SHA^{tree}")" ]]
          git config user.name 'd-robotics-rdk-component-pr-bot[bot]'
          git config user.email '323572512+d-robotics-rdk-component-pr-bot[bot]@users.noreply.github.com'
          marker='docs/.review-handoff-app-marker'
          printf 'one-time Component App review identity handoff\n' > "$marker"
          git add "$marker"
          git commit -s -m 'chore: attribute review handoff push to Component App'
          git rm "$marker"
          git commit -s -m 'chore: restore reviewed handoff tree'
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$(git rev-parse "$SOURCE_SHA^{tree}")" ]]
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_head=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk 'NR == 1 { print $1 }')
          [[ "$remote_head" == "$(git rev-parse HEAD)" ]]
          printf 'Component App pushed identical candidate tree at %s\n' "$remote_head" >> "$GITHUB_STEP_SUMMARY"

  validate:
    if: inputs.schema_version != 'review-handoff-pr-8-app-push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      component_id: ${{ steps.validate.outputs.component_id }}
      action: ${{ steps.noop-check.outputs.action }}
      repair: ${{ steps.noop-check.outputs.repair }}
      dry_run: ${{ steps.event.outputs.dry_run }}
      source_repo: ${{ steps.validate.outputs.source_repo }}
      tag: ${{ steps.validate.outputs.tag }}
      release_url: ${{ steps.validate.outputs.release_url }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - name: Checkout trusted Hub validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation dependencies
        run: python3 -m pip install -r .github/requirements.txt

      - name: Normalize input and require dispatcher authority
        id: event
        env:
          SCHEMA_VERSION: ${{ inputs.schema_version }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          TAG: ${{ inputs.tag }}
          RELEASE_URL: ${{ inputs.release_url }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PUBLISHED_AT: ${{ inputs.published_at }}
          DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_ACTOR: ${{ github.actor }}
          EXPECTED_ACTOR: ${{ vars.RDK_RELEASE_DISPATCHER_ACTOR }}
        run: |
          set -euo pipefail
          [[ "$DRY_RUN" == true || "$DRY_RUN" == false ]] || { echo "invalid dry_run input" >&2; exit 1; }
          [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "invalid source repository" >&2; exit 1; }
          python3 -B .github/scripts/release_contract.py validate-tag "$TAG"
          python3 -B .github/scripts/component_upgrade.py require-dispatch-authority \
            --dry-run "$DRY_RUN" --actor "$DISPATCH_ACTOR" --expected-actor "$EXPECTED_ACTOR"
          if [[ "$DRY_RUN" == false ]]; then
            [[ "$SCHEMA_VERSION" == 1 ]] || { echo "invalid dispatch schema" >&2; exit 1; }
            [[ -n "$RELEASE_URL" && "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ && -n "$PUBLISHED_AT" ]] || {
            echo "automated dispatch is missing verified Release facts" >&2
            exit 1
            }
          fi
          printf 'source_repo=%s\ntag=%s\ndry_run=%s\n' "$SOURCE_REPO" "$TAG" "$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Record the trusted main candidate
        id: candidate
        run: printf 'candidate_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the source Release against GitHub
        id: validate
        env:
          SOURCE_REPO: ${{ steps.event.outputs.source_repo }}
          TAG: ${{ steps.event.outputs.tag }}
          DRY_RUN: ${{ steps.event.outputs.dry_run }}
          PAYLOAD_RELEASE_URL: ${{ inputs.release_url }}
          PAYLOAD_TARGET_SHA: ${{ inputs.target_sha }}
          PAYLOAD_PUBLISHED_AT: ${{ inputs.published_at }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$SOURCE_REPO/releases/tags/$TAG")
          tag_ref=$(gh api "repos/$SOURCE_REPO/git/ref/tags/$TAG")
          tag_object_sha=$(jq -r '.object.sha // empty' <<<"$tag_ref")
          [[ "$tag_object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source tag object SHA is missing" >&2; exit 1; }
          tag_object=$(gh api "repos/$SOURCE_REPO/git/tags/$tag_object_sha")
          fact_file=$(mktemp)
          trap 'rm -f "$fact_file"' EXIT
          jq -n --arg repo "$SOURCE_REPO" --arg tag "$TAG" \
            --argjson release "$release" --argjson tag_ref "$tag_ref" --argjson tag_object "$tag_object" \
            '[{repo: $repo, tag: $tag, release: $release, tag_ref: $tag_ref, tag_object: $tag_object}]' > "$fact_file"
          verified=$(python3 -B .github/scripts/release_contract.py validate-facts --facts-json "$fact_file")
          api_url=$(jq -r '.[0].release_url' <<<"$verified")
          api_published_at=$(jq -r '.[0].published_at' <<<"$verified")
          source_sha=$(jq -r '.[0].source_sha' <<<"$verified")
          if [[ "$DRY_RUN" == false ]]; then
            [[ "$PAYLOAD_RELEASE_URL" == "$api_url" && "${PAYLOAD_TARGET_SHA,,}" == "${source_sha,,}" && "$PAYLOAD_PUBLISHED_AT" == "$api_published_at" ]] || {
              echo "dispatcher inputs do not match the published source Release" >&2
              exit 1
            }
          fi
          python3 -B - "$SOURCE_REPO" "$TAG" "$source_sha" "$api_url" "$api_published_at" >> "$GITHUB_OUTPUT" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          module_path = Path(".github/scripts/component_release.py")
          spec = importlib.util.spec_from_file_location("component_release", module_path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          source_repo, tag, source_sha, release_url, published_at = sys.argv[1:]
          matches = [component for component in module.load_components(Path(".")) if component.repo == source_repo]
          if len(matches) != 1:
              raise SystemExit("source repository must match exactly one component")
          event = module.ComponentReleaseEvent(
              source_repo, tag, source_sha, release_url, published_at,
              is_draft=False, is_prerelease=False,
          )
          decision = module.decide_upgrade(matches[0], event, verified_target_sha=source_sha)
          print(f"component_id={matches[0].component_id}")
          print(f"action={decision.action}")
          print(f"source_repo={source_repo}")
          print(f"tag={tag}")
          print(f"release_url={release_url}")
          print(f"source_sha={source_sha}")
          PY

      - name: Reject an event older than the stable proposal branch
        env:
          COMPONENT_ID: ${{ steps.validate.outputs.component_id }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          component_file="components.d/${COMPONENT_ID}.yml"
          main_tag=$(python3 -B -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1], encoding="utf-8"))["ref"])' "$component_file")
          branch_ref="refs/heads/bot/component-upgrade/${COMPONENT_ID}"
          proposal_sha=$(git ls-remote --heads origin "$branch_ref" | awk 'NR == 1 { print $1 }')
          order_args=(.github/scripts/component_upgrade.py require-release-order --incoming-tag "$TAG" --main-tag "$main_tag")
          if [[ -n "$proposal_sha" ]]; then
            [[ "$proposal_sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid proposal branch SHA" >&2; exit 1; }
            git fetch --no-tags origin "$branch_ref"
            proposal_tag=$(git show "$proposal_sha:$component_file" | python3 -B -c 'import sys,yaml; data=yaml.safe_load(sys.stdin.read()); print(data.get("ref", "") if isinstance(data,dict) else "")')
            order_args+=(--proposal-tag "$proposal_tag")
          fi
          python3 -B "${order_args[@]}"

      - name: Verify a candidate noop has no mirror or artifact drift
        id: noop-check
        env:
          CANDIDATE_ACTION: ${{ steps.validate.outputs.action }}
          COMPONENT_ID: ${{ steps.validate.outputs.component_id }}
          SOURCE_SHA: ${{ steps.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_ACTION" != noop ]]; then
            printf 'action=%s\nrepair=false\n' "$CANDIDATE_ACTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verify_root=$(mktemp -d)
          summary_file=$(mktemp)
          cleanup() { rm -f "$summary_file"; git worktree remove --force "$verify_root" 2>/dev/null || rm -rf "$verify_root"; }
          trap cleanup EXIT
          git worktree add --detach "$verify_root" "${{ steps.candidate.outputs.candidate_sha }}"
          (
            cd "$verify_root"
            bash .github/scripts/sync-components.sh \
              --components-dir components.d \
              --component "$COMPONENT_ID" \
              --repo-base-url https://github.com \
              --work-root ".tmp/component-sync-noop-${COMPONENT_ID}" \
              --summary-file "$summary_file"
            catalog_dirs=$(python3 -B .github/scripts/component_upgrade.py validate-sync-summary \
              --summary-file "$summary_file" --source-sha "$SOURCE_SHA")
            .github/scripts/build-plugins.sh
            bash .github/scripts/regenerate-readme.sh
            staged=$(python3 -B .github/scripts/component_upgrade.py stage-proposal \
              --component-file "components.d/${COMPONENT_ID}.yml" \
              --catalog-dirs-json "$catalog_dirs" --repair)
            if [[ "$staged" == '[]' ]]; then
              printf 'action=noop\nrepair=false\n' >> "$GITHUB_OUTPUT"
            else
              printf 'action=upgrade\nrepair=true\n' >> "$GITHUB_OUTPUT"
            fi
          )

  build-proposal:
    needs: validate
    if: needs.validate.outputs.dry_run != 'true' && needs.validate.outputs.action == 'upgrade'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the exact trusted main candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install synchronization dependencies
        run: python3 -m pip install -r .github/requirements.txt

      - name: Build and test the proposal without write credentials
        env:
          COMPONENT_ID: ${{ needs.validate.outputs.component_id }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_URL: ${{ needs.validate.outputs.release_url }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          REPAIR: ${{ needs.validate.outputs.repair }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/component-upgrade-artifact"
          mkdir -p "$artifact_root"
          args=(
            .github/scripts/upsert-component-pr.sh
            --component "$COMPONENT_ID"
            --tag "$TAG"
            --release-url "$RELEASE_URL"
            --source-sha "$SOURCE_SHA"
            --patch-file "$artifact_root/proposal.patch"
            --metadata-file "$artifact_root/proposal.json"
          )
          [[ "$REPAIR" == true ]] && args+=(--repair)
          bash "${args[@]}"

      - name: Store the validated proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-upgrade-proposal
          path: ${{ runner.temp }}/component-upgrade-artifact
          if-no-files-found: error
          retention-days: 1

  upsert-pr:
    needs: [validate, build-proposal]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the exact trusted main candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install publication dependencies
        run: python3 -m pip install -r .github/requirements.txt

      - name: Download the validated proposal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: component-upgrade-proposal
          path: ${{ runner.temp }}/component-upgrade-artifact

      - name: Create exact-repository component proposal token
        id: proposal-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RDK_COMPONENT_PR_BOT_APP_ID }}
          private-key: ${{ secrets.RDK_COMPONENT_PR_BOT_PRIVATE_KEY }}
          owner: D-Robotics
          repositories: rdk-skills
          permission-contents: write
          permission-pull-requests: write

      - name: Configure exact public Hub transport
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/D-Robotics/rdk-skills.git"
          [[ "$(git remote get-url origin)" == "https://github.com/D-Robotics/rdk-skills.git" ]]

      - name: Push the bot branch and upsert its PR
        env:
          GH_TOKEN: ${{ steps.proposal-app-token.outputs.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/publish-component-pr.sh \
            --patch-file "$RUNNER_TEMP/component-upgrade-artifact/proposal.patch" \
            --metadata-file "$RUNNER_TEMP/component-upgrade-artifact/proposal.json" \
            --summary-file "$RUNNER_TEMP/component-upgrade-result.json"

  report-failure:
    needs: [validate, build-proposal, upsert-pr]
    if: >-
      ${{ always() && !cancelled() &&
          (needs.validate.result == 'failure' ||
           needs.build-proposal.result == 'failure' ||
           needs.upsert-pr.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted Issue-rendering code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Render bounded redacted failure details
        env:
          COMPONENT_ID: ${{ needs.validate.outputs.component_id }}
          SOURCE_REPO: ${{ needs.validate.outputs.source_repo }}
          TAG: ${{ needs.validate.outputs.tag }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build-proposal.result }}
          UPSERT_RESULT: ${{ needs.upsert-pr.result }}
        run: |
          set -euo pipefail
          results=$(jq -n \
            --arg validate "$VALIDATE_RESULT" \
            --arg build "$BUILD_RESULT" \
            --arg upsert "$UPSERT_RESULT" \
            '{validate: $validate, "build-proposal": $build, "upsert-pr": $upsert}')
          python3 -B .github/scripts/component_upgrade.py render-failure-issue \
            --component "$COMPONENT_ID" \
            --source-repo "$SOURCE_REPO" \
            --tag "$TAG" \
            --job-results-json "$results" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --title-file "$RUNNER_TEMP/failure-title.txt" \
            --body-file "$RUNNER_TEMP/failure-body.md"

      - name: Create or update the failure tracker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          label='component-upgrade-failure'
          gh label list --limit 100 --json name --jq '.[].name' | grep -Fxq "$label" || {
            echo "::error::Repository administrators must pre-create the $label label."
            exit 1
          }
          title=$(cat "$RUNNER_TEMP/failure-title.txt")
          issues=$(gh issue list --state open --label "$label" --limit 100 --json number,title)
          issue_number=$(ISSUES_JSON="$issues" python3 -B - "$title" <<'PY'
          import json
          import os
          import sys

          title = sys.argv[1]
          rows = json.loads(os.environ["ISSUES_JSON"])
          print(next((row["number"] for row in rows if row.get("title") == title), ""))
          PY
          )
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --title "$title" --body-file "$RUNNER_TEMP/failure-body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/failure-body.md" --label "$label"
          fi
