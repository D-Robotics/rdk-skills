#
# This workflow is deliberately observational.  It reconstructs every pinned
# component in a disposable worktree, compares its mirrors and generated
# catalog artifacts, and opens one rolling issue when the committed catalog is
# no longer reproducible.  component-upgrade.yml is the sole write path for
# catalog, branch, PR, and tag changes.

name: Reconcile pinned components

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: reconcile-components
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed catalog
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install reconciliation dependencies
        run: python3 -m pip install -r .github/requirements.txt

      - name: Reconstruct pinned components in a disposable worktree
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          verify_root=$(mktemp -d)
          summary_root=$(mktemp -d)
          results_file=$(mktemp)
          : > "$results_file"
          cleanup() {
            git worktree remove --force "$verify_root" 2>/dev/null || rm -rf "$verify_root"
            rm -rf "$summary_root"
            rm -f "$results_file"
          }
          trap cleanup EXIT

          (
            set -euo pipefail
            git worktree add --detach "$verify_root" HEAD
            shopt -s nullglob
            component_files=("$verify_root"/components.d/*.yml)
            [[ "${#component_files[@]}" -gt 0 ]] || exit 1

            for component_file in "${component_files[@]}"; do
              component_id=$(basename "$component_file" .yml)
              if [[ ! "$component_id" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
                printf '%s\n' 'unknown component descriptor has an invalid file name' >> "$results_file"
                continue
              fi
              source_repo=$(yq -r '.repo' "$component_file")
              source_ref=$(yq -r '.ref' "$component_file")
              summary_file="$summary_root/${component_id}.json"
              fact_file="$summary_root/${component_id}-facts.json"

              if [[ ! "$source_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || \
                ! python3 -B "$GITHUB_WORKSPACE/.github/scripts/release_contract.py" validate-tag "$source_ref"; then
                printf '%s: invalid source repository or canonical tag\n' "$component_id" >> "$results_file"
                continue
              fi
              if ! release=$(gh api "repos/$source_repo/releases/tags/$source_ref"); then
                printf '%s: published formal Release is inaccessible\n' "$component_id" >> "$results_file"
                continue
              fi
              if ! tag_ref=$(gh api "repos/$source_repo/git/ref/tags/$source_ref"); then
                printf '%s: annotated source tag is inaccessible\n' "$component_id" >> "$results_file"
                continue
              fi
              tag_object_sha=$(jq -r '.object.sha // empty' <<<"$tag_ref")
              if [[ ! "$tag_object_sha" =~ ^[0-9a-fA-F]{40}$ ]] || \
                ! tag_object=$(gh api "repos/$source_repo/git/tags/$tag_object_sha"); then
                printf '%s: source tag is not a readable annotated tag\n' "$component_id" >> "$results_file"
                continue
              fi
              jq -n --arg repo "$source_repo" --arg tag "$source_ref" \
                --argjson release "$release" --argjson tag_ref "$tag_ref" --argjson tag_object "$tag_object" \
                '[{repo: $repo, tag: $tag, release: $release, tag_ref: $tag_ref, tag_object: $tag_object}]' \
                > "$fact_file"
              if ! verified=$(python3 -B "$GITHUB_WORKSPACE/.github/scripts/release_contract.py" \
                validate-facts --facts-json "$fact_file"); then
                printf '%s: source ref lacks a published formal Release\n' "$component_id" >> "$results_file"
                continue
              fi
              pinned_sha=$(jq -r '.[0].source_sha' <<<"$verified")

              if ! (
                cd "$verify_root"
                bash "$GITHUB_WORKSPACE/.github/scripts/sync-components.sh" \
                  --components-dir components.d \
                  --component "$component_id" \
                  --repo-base-url https://github.com \
                  --work-root ".tmp/component-sync-reconcile-${component_id}" \
                  --summary-file "$summary_file"
              ); then
                printf '%s: failed to reconstruct the published source Release\n' "$component_id" >> "$results_file"
                continue
              fi

              reconstructed_sha=$(yq -r '.components[0].source_sha' "$summary_file")
              if [[ "${reconstructed_sha,,}" != "${pinned_sha,,}" ]]; then
                printf '%s: reconstructed SHA differs from the formal Release\n' "$component_id" >> "$results_file"
              fi
            done

            if ! (
              cd "$verify_root"
              "$GITHUB_WORKSPACE/.github/scripts/build-plugins.sh"
              bash "$GITHUB_WORKSPACE/.github/scripts/regenerate-readme.sh"
            ); then
              printf '%s\n' 'catalog or plugin regeneration failed' >> "$results_file"
            fi

            git -C "$verify_root" add -A -f .
            if ! git -C "$verify_root" diff --cached --quiet; then
              printf '%s\n' 'component mirrors, catalog, plugins, or README are stale' >> "$results_file"
            fi
          )
          reconcile_status=$?
          if [[ "$reconcile_status" -ne 0 ]]; then
            printf '%s\n' 'reconciliation execution failed before completing all checks' >> "$results_file"
          fi

          if [[ -s "$results_file" ]]; then
            output_delimiter=$(python3 -c 'import uuid; print(uuid.uuid4())')
            {
              printf 'has_drift=true\n'
              # Component metadata is untrusted for this report. A unique
              # delimiter prevents an invalid multiline value from forging a
              # GITHUB_OUTPUT record or truncating the details field.
              printf 'details<<%s\n' "$output_delimiter"
              sort -u "$results_file"
              printf '%s\n' "$output_delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            echo 'has_drift=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update reconciliation issue
        if: steps.reconcile.outputs.has_drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DETAILS: ${{ steps.reconcile.outputs.details }}
        run: |
          set -euo pipefail
          label='component-upgrade-failure'
          if ! gh label list --search "$label" --limit 100 --json name --jq '.[].name' | grep -Fxq "$label"; then
            echo "::error::Repository administrators must pre-create the $label label before reconciliation can report drift."
            exit 1
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title='Component reconciliation failure tracker'
          body=$(cat <<EOF
          The pinned component reconciliation detected invalid references or catalog drift.

          **Most recent run:** ${run_url}

          **Findings:**
          ${DETAILS}

          This rolling issue is opened or updated only by the read-only reconciliation workflow. Resolve the source or committed mirror through the reviewed component-upgrade workflow.
          EOF
          )
          issue_number=$(gh issue list --state open --label "$label" --search '"Component reconciliation failure tracker" in:title' --json number --jq '.[0].number')
          if [[ -n "$issue_number" && "$issue_number" != null ]]; then
            gh issue edit "$issue_number" --title "$title" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "$label"
          fi

      - name: Mark reconciliation drift as failed
        if: steps.reconcile.outputs.has_drift == 'true'
        run: |
          echo '::error::Pinned components do not reconcile with the committed catalog.'
          exit 1
