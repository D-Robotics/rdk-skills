#
# DCO (Developer Certificate of Origin) check — requires all commits
# to be signed off. Bot branches (automated/*) are exempt.

name: DCO Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  dco:
    runs-on: ubuntu-latest
    # Exempt bot branches from DCO check
    if: ${{ !startsWith(github.head_ref, 'automated/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: DCO Check
        uses: christophebedard/dco-check@v0.5.2
        with:
          args: --verbose
