# 项目：RDK X5
# 板型说明：RDK X5（X5 MD）。对应板端文档 board_info/rdkx5_board.md
# 编译部署依据 x5-rdk-gen：仓库在 source/ 下，./mk_debs.sh <包名>，deb 产物在 deploy/deb_pkgs。
# 板端登录依据 RDK 远程登录文档：用户名 sunrise，密码 sunrise。
# 测试目录依据 RDK X5 get_vin_data：/app/multimedia_samples/sample_vin/get_vin_data，板上 sudo make 后执行。
# RAW 通过后继续 get_isp_data：/app/multimedia_samples/sample_isp/get_isp_data。交互键 g 后 dump ISP YUV。

# 项目根目录由用户在入口第 2 条提供。

# ── 板型 ──
# 当前项目使用的开发板型号（AI据此读取对应的板端文档）
board=rdkx5

# ── 仓库路径 ──
# 格式：名称=相对于项目根目录的相对路径
hobot_camera=source/hobot-camera
hobot-multimedia-samples=source/hobot-multimedia-samples

# ── 编译命令 ──
# 格式：名称=命令（在项目根目录下执行，或写完整路径）
# 多个仓库需要编译时按依赖顺序排列
build_hobot_camera=./mk_debs.sh hobot-camera
build_hobot-multimedia-samples=./mk_debs.sh hobot-multimedia-samples

# ── 板子连接信息 ──
# AI 执行 deploy/install 时会自动拼接 board_user@board_ip，不需要在下面命令中重复写
board_user=sunrise
board_password=sunrise

# ── 推送到板子 ──
# 命令中使用占位符 {user}@{ip}，AI 执行时自动替换
deploy_hobot_camera=scp deploy/deb_pkgs/hobot-camera_*_arm64.deb {user}@{ip}:/tmp/hobot-camera_arm64.deb
deploy_hobot-multimedia-samples=scp deploy/deb_pkgs/hobot-multimedia-samples_*_arm64.deb {user}@{ip}:/tmp/hobot-multimedia-samples_arm64.deb

# ── 安装到板子 ──
# 命令中使用占位符 {user}@{ip}，AI 执行时自动替换
install_hobot_camera=ssh {user}@{ip} 'sudo dpkg -i /tmp/hobot-camera_arm64.deb'
install_hobot-multimedia-samples=ssh {user}@{ip} 'sudo dpkg -i /tmp/hobot-multimedia-samples_arm64.deb'

# ── 登录板端执行测试 ──
# 测试须先 ssh 登录板端交互 shell（非单条 ssh 命令），在板端 shell 内依次执行下列键对应的指令。
# 占位符替换：{camera_index}→新 sensor 在 vp_sensor_config_list 中的序号
# 进入交互菜单后需输入 l = get a set frames 才 dump RAW，再 q 退出。
test_dir=/app/multimedia_samples/sample_vin/get_vin_data
test_clean=sudo make clean
test_build=sudo make
test_prepare=sudo logcat -c; sudo dmesg -C
test_cmd=printf 'l\nq\n' | sudo ./get_vin_data -s {camera_index}

# ── ISP 建链测试（get_isp_data）──
# 仅本 conf 含 isp_test_dir。RAW 成功后才执行。
# 模板与板端路径中的 {sensor} → camera_config.name。
# isp_test_cmd 占位符与 test_cmd 相同：{camera_index}→vp_sensor_config_list 序号。
# 进入交互菜单后输入 g 才 dump ISP YUV，再 q 退出。等待上限见 isp_test_wait_sec。
isp_tuning_src=source/hobot-camera/drivers/isp_json/dummy_tuning.json
isp_tuning_board=/usr/hobot/lib/sensor/{sensor}_tuning.json
isp_test_dir=/app/multimedia_samples/sample_isp/get_isp_data
isp_test_clean=sudo make clean
isp_test_build=sudo make
isp_test_prepare=sudo logcat -c; sudo dmesg -C
isp_test_cmd=printf 'g\nq\n' | sudo ./get_isp_data -s {camera_index}
isp_test_wait_sec=30
