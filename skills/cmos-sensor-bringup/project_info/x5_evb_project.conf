# 项目：project_sample
# 项目根目录由用户在入口第 2 条提供。

# ── 板型 ──
# 当前项目使用的开发板型号（AI据此读取对应的板端文档）
board=x5_evb

# ── 仓库路径 ──
# 格式：名称=相对于项目根目录的相对路径
camsys=hbre/camsys
platform_samples=app/samples/platform_samples

# ── 编译命令 ──
# 格式：名称=命令（在项目根目录下执行，或写完整路径）
# 多个仓库需要编译时按依赖顺序排列
build_platform_samples=./bd.sh lunch 0;./bd.sh app;./bd.sh hbre;

# ── 板子连接信息 ──
# AI 执行 deploy/install 时会自动拼接 board_user@board_ip，不需要在下面命令中重复写
board_user=root
board_password=root

# ── 推送到板子 ──
# 命令中使用占位符 {user}@{ip}，AI 执行时自动替换
deploy_prepare=mount -o remount,rw "$(df /usr/hobot/lib/sensor | awk 'NR==2 {print $1}')"
deploy_sample_vin=scp app/samples/platform_samples/sample_vin/get_vin_data/get_vin_data   {user}@{ip}:/app/platform_samples/sample_vin/get_vin_data/
deploy_sample_lib=scp -r out/deploy/hbre/lib/sensor {user}@{ip}:/usr/hobot/lib

# ── 安装到板子 ──
# 先 ssh 登录板端
# 命令中使用占位符 {user}@{ip}，AI 执行时自动替换
install_hobot-camera=ssh {user}@{ip} 'sync'

# ── 登录板端执行测试 ──
# 测试须先 ssh 登录板端交互 shell（非单条 ssh 命令），在板端 shell 内依次执行下列键对应的指令。
# 0. 登录板端交互 shell
#    AI 执行时：sshpass -p {board_password} ssh -o StrictHostKeyChecking=no {user}@{ip}
#    登录后 cd 到 test_dir，按 SKILL.md 第4步固定顺序执行 test_clean → test_prepare → test_cmd（无 test_build）。
#
# 占位符替换：{camera_index}→新 sensor 在 vp_sensor_config_list 中的序号
# 进入交互菜单后需输入 l = get a set frames 才 dump RAW，再 q 退出；
# test_cmd 与交互命令 l/q 组合为一条，通过管道喂入。
test_dir=/app/platform_samples/sample_vin/get_vin_data
test_clean=rm -f *.raw *.yuv *.nv12
test_prepare=export PATH=/usr/hobot/bin:$PATH;export LD_LIBRARY_PATH=/usr/hobot/lib:/usr/hobot/lib/sensor:$LD_LIBRARY_PATH;logcat -c;dmesg -C
test_cmd=printf 'l\nq\n' | ./get_vin_data -s {camera_index}
