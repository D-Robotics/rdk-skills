# 项目：S100（6V 默认转接板）
# 板型说明：S100 6V 默认转接板（1 个 MAX96712，最多 4 路 GMSL，RX0/RX1 可纯 MIPI 直连）。对应板端文档 board_info/s100_6v_board.md

# 项目根目录由用户在入口第 2 条提供。

# ── 板型 ──
# 当前项目使用的开发板型号（AI据此读取对应的板端文档）
board=s100_6v

# ── 仓库路径 ──
# 格式：名称=相对于项目根目录的相对路径
hobot_camera=source/hobot-camera
hobot-multimedia-samples=source/hobot-multimedia-samples
hobot-spdev=source/hobot-spdev

# ── 编译命令 ──
# 格式：名称=命令（在项目根目录下执行，或写完整路径）
# 多个仓库需要编译时按依赖顺序排列
build_hobot_camera=sudo ./mk_debs.sh hobot-camera
build_hobot-multimedia-samples=sudo ./mk_debs.sh hobot-multimedia-samples
build_hobot-spdev=sudo ./mk_debs.sh hobot-spdev

# ── 板子连接信息 ──
# AI 执行 deploy/install 时会自动拼接 board_user@board_ip，不需要在下面命令中重复写
board_user=root
board_password=root

# ── 推送到板子 ──
# 命令中使用占位符 {user}@{ip}，AI 执行时自动替换
deploy_hobot_camera=scp out/product/deb_packages/hobot-camera_*_arm64.deb  {user}@{ip}:/root/hobot-camera_arm64.deb
deploy_hobot-multimedia-samples=scp out/product/deb_packages/hobot-multimedia-samples_*_arm64.deb {user}@{ip}:/root/hobot-multimedia-samples_arm64.deb
deploy_hobot-spdev=scp out/product/deb_packages/hobot-spdev_*_arm64.deb {user}@{ip}:/root/hobot-spdev_arm64.deb

# ── 安装到板子 ──
# 先 ssh 登录板端，再执行 dpkg -i 安装对应的 deb 包
# 命令中使用占位符 {user}@{ip}，AI 执行时自动替换
install_hobot_camera=ssh {user}@{ip} 'dpkg -i /root/hobot-camera_arm64.deb'
install_hobot-multimedia-samples=ssh {user}@{ip} 'dpkg -i /root/hobot-multimedia-samples_arm64.deb'
install_hobot-spdev=ssh {user}@{ip} 'dpkg -i /root/hobot-spdev_arm64.deb'

# ── 登录板端执行测试 ──
test_dir=/app/multimedia_samples/sample_vin/get_vin_data
test_clean=make clean
test_build=make
test_prepare=export CAM_POWER_AUTO=1;logcat -c;dmesg -C
# test_cmd 占位符替换规则：{camera_index}→第3步输出的 camera_index；{mipi_index}→用户入口输入的 mipi_index；{link_index}→用户入口输入的 link_index 按字母→数字映射(A→0,B→1,C→2,D→3)；按 camera 类型选择下方命令，direct MIPI 不传 -l；执行前不得残留占位符
test_cmd_mipi=printf "l\nq\n" | ./get_vin_data -s {camera_index} -m {mipi_index}
test_cmd_serdes=printf "l\nq\n" | ./get_vin_data -s {camera_index} -l {link_index} -m {mipi_index}
