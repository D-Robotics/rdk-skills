model_parameters:
  prototxt: /absolute/path/model.prototxt
  caffe_model: /absolute/path/model.caffemodel
  march: bayes-e
  output_model_file_prefix: model_x5
  working_dir: /absolute/path/x5-output
  layer_out_dump: false
input_parameters:
  input_name: data
  input_type_train: bgr
  input_layout_train: NCHW
  input_shape: 1x3x224x224
  input_type_rt: nv12
  input_batch: 1
  norm_type: no_preprocess
calibration_parameters:
  cal_data_dir: /absolute/path/calibration-data
  cal_data_type: float32
  calibration_type: default
compiler_parameters:
  compile_mode: latency
  debug: true
  core_num: 1
  optimize_level: O2
  input_source:
    data: pyramid
  jobs: 8
