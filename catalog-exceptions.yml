# Catalog exceptions — skills/ dirs allowed to exist WITHOUT a
# components.d registration. Everything else in skills/ must be declared
# by a components.d/<slug>.yml entry or listed here — otherwise the
# daily sync prunes it (see .github/scripts/prune-orphans.sh).
#
# Add an entry only with a documented reason and an owner.
exceptions:
  - dir: rdk-skill-finder
    reason: Hub-native infrastructure skill for deterministic discovery from the generated Skill index; maintained via direct PR (no components.d upstream)
    owner: Machao615
    component: D-Robotics Skills
  - dir: rdk-pack-installer
    reason: Hub-native infrastructure skill for installing workspace-integrated packs; maintained via direct PR (no components.d upstream)
    owner: Machao615
    component: D-Robotics Skills
