  - path: skills/rdk-vision-pipeline/
    catalog_dir: rdk-vision-pipeline
  - path: skills/rdk-model-deploy/
    catalog_dir: rdk-model-deploy
  - path: skills/rdk-model-benchmark/
    catalog_dir: rdk-model-benchmark
  - path: skills/rdk-docs-reference/
    catalog_dir: rdk-docs-reference
  - path: skills/rdk-system-config/
    catalog_dir: rdk-system-config
  - path: skills/rdk-network-remote/
    catalog_dir: rdk-network-remote
  - path: skills/rdk-system-maintain/
    catalog_dir: rdk-system-maintain
  - path: skills/rdk-log-forensics/
    catalog_dir: rdk-log-forensics
  - path: skills/rdk-gpio-40pin/
