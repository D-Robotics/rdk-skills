name: BSP Skills
repo: D-Robotics/bsp-skills
ref: v1.0.0
description: Board Support Package (BSP) development skills for RDK boards — host cross-compilation environment, repo/manifest source sync, system image build, kernel/DTB/driver modules, hobot-* deb packages, bootloader/miniboot, Ubuntu rootfs customization for X3/X5, and S-series source acquisition.
skills:
  - path: skills/bsp-env-setup/
    catalog_dir: bsp-env-setup
  - path: skills/bsp-source-sync/
    catalog_dir: bsp-source-sync
  - path: skills/bsp-image-build/
    catalog_dir: bsp-image-build
  - path: skills/bsp-kernel-build/
    catalog_dir: bsp-kernel-build
  - path: skills/bsp-deb-build/
    catalog_dir: bsp-deb-build
  - path: skills/bsp-bootloader-build/
    catalog_dir: bsp-bootloader-build
  - path: skills/bsp-rootfs-custom/
    catalog_dir: bsp-rootfs-custom
  - path: skills/bsp-s-series/
    catalog_dir: bsp-s-series
links:
  contributing: CONTRIBUTING.md
  discussions: false
